[project]
name = "pfasimplu-cli"
version = "0.1.0"
description = "Local-first CLI for generating Romanian PFA fiscal registers from a ZIP of documents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "typer>=0.15.0",
    "google-genai>=1.56.0",
    "pydantic>=2.10.0",
    "pypdf>=6.4.1",
    "pandas>=2.3.3",
    "numpy>=1.26.0",
    "openpyxl>=3.1.5",
    "joblib>=1.5.2",
    "rapidfuzz>=3.14.3",
    "tenacity>=9.1.2",
    "unidecode>=1.4.0",
    "cursvalutarbnr==1.0.5",
    "python-dateutil>=2.9.0",
    "tomli-w>=1.1.0",
    "python-dotenv>=1.1.1",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[project.scripts]
pfasimplu-cli = "pfasimplu_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pfasimplu_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
